{% extends 'layout.html' %}
{% load static %}
{% block title %}
Complaint Section - Online Gram Panchayat
{% endblock %}
{% block content %}

<div class="flex w-full px-3 md:w-8/12 mx-0 md:mx-auto mt-14">
  <div class=" bg-white rounded-2xl shadow-lg w-full" style="padding: 3rem;">
    <h2 class="text-2xl md:text-3xl font-bold text-center text-gray-800 mb-6">
      Register Your Complaint
    </h2>

    <form method="post" enctype="multipart/form-data" id="complaintForm" class="flex flex-col gap-4 text-black">
  {% csrf_token %}
  
  <!-- Full Name -->
  <div>
    <label for="name" class="block text-sm font-semibold text-gray-700">Full Name <span class="text-red-700">*</span></label>
    <input type="text" id="name" name="fname" required placeholder="Enter your full name"
      class="w-full px-4 py-2 my-2 border border-gray-300 rounded-lg focus:ring-1 focus:ring-blue-500 focus:outline-none" />
  </div>

  <!-- Phone -->
  <div>
    <label for="phone" class="block text-sm font-semibold text-gray-700">Phone Number<span class="text-red-700">*</span></label>
    <input type="tel" id="phone" name="phone_num" required placeholder="Enter your phone number"
      class="w-full px-4 py-2 border my-2 border-gray-300 rounded-lg focus:ring-1 focus:ring-blue-500 focus:outline-none" />
  </div>

  <!-- Email -->
  <div>
    <label for="email" class="block text-sm font-semibold text-gray-700">Email Address</label>
    <input type="email" id="email" name="Email" placeholder="Enter your email (optional)"
      class="w-full px-4 py-2 border my-2 border-gray-300 rounded-lg focus:ring-1 focus:ring-blue-500 focus:outline-none" />
  </div>

  <!-- Category -->
  <div>
    <label for="category" class="block text-sm font-semibold text-gray-700">Complain Category<span class="text-red-700">*</span></label>
    <select id="category" name="complain" required
      class="w-full px-4 py-2 border my-2 border-gray-300 rounded-lg focus:ring-1 focus:ring-blue-500 focus:outline-none">
      <option value="">-- Select Category --</option>
      <option value="Water">Water Supply</option>
      <option value="Electricity">Electricity</option>
      <option value="Road">Road / Infrastructure</option>
      <option value="Sanitation">Sanitation</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <!-- Complaint Details -->
  <div>
    <label for="details" class="block text-sm font-semibold text-gray-700">Complaint Details</label>
    <textarea id="details" name="Complaint_Details" required placeholder="Write your complaint here..."
      class="w-full px-4 py-2 border my-2 border-gray-300 rounded-lg focus:ring-1 focus:ring-blue-500 focus:outline-none min-h-[120px] resize-y"></textarea>
  </div>

  <!-- File Upload (optional, only if you add field in model) -->
  <div>
    <label for="file" class="block text-sm font-semibold text-gray-700">Attach File/Photo (optional)</label>
    <input type="file" id="file" name="photo" accept="image/*,application/pdf"
      class="w-fit text-gray-700 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer" />
  </div>

  <!-- Submit -->
  <div class="text-center">
    <button type="submit"
      class="w-full md:w-full bg-blue-600 text-white font-semibold px-6 py-3 rounded-lg shadow-md hover:bg-blue-700 transition duration-300">
      Submit Complaint
    </button>
  </div>
</form>

  </div>
</div>


{% endblock %}
