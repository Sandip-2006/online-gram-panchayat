{% extends 'layout.html' %}
{% load static %}
{% block title %}
  Feedback Section - Online Gram Panchayat
{% endblock %}

{% block content %}

    {% if messages %}
      <div class="container mx-auto max-w-6xl px-6 mt-6">
        {% for message in messages %}
          <div
            class="mb-4 px-4 py-3 rounded-lg text-white {% if message.tags == 'success' %}bg-green-500{% elif message.tags == 'error' %}bg-red-500{% else %}bg-blue-500{% endif %} shadow-md"
            role="alert"
          >
            <span class="block sm:inline">{{ message }}</span>
          </div>
        {% endfor %}
      </div>
    {% endif %}

  <div class="flex w-full px-3 md:w-8/12 mx-0 md:mx-auto mt-14">
    <div class="bg-white rounded-2xl shadow-lg w-full" style="padding: 3rem;">
      <h2 class="text-2xl md:text-3xl font-bold text-center text-gray-800 mb-6">
        Share Your Valuable Feedback 💬
      </h2>

      <form method="post" enctype="multipart/form-data" id="feedbackForm" class="flex flex-col gap-4 text-black">
        {% csrf_token %}

        <!-- Full Name -->
        <div>
          <label for="name" class="block text-sm font-semibold text-gray-700">
            Full Name <span class="text-red-700">*</span>
          </label>
          <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Enter your full name"
            class="w-full px-4 py-2 my-2 border border-gray-300 rounded-lg focus:ring-1 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700">
            Email Address <span class="text-red-700">*</span>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Enter your email"
            class="w-full px-4 py-2 border my-2 border-gray-300 rounded-lg focus:ring-1 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <!-- Rating -->
        <div>
          <label for="rating" class="block text-sm font-semibold text-gray-700">
            Rating <span class="text-red-700">*</span>
          </label>
          <select
            id="rating"
            name="rating"
            required
            class="w-full px-4 py-2 border my-2 border-gray-300 rounded-lg focus:ring-1 focus:ring-blue-500 focus:outline-none"
          >
            <option value="">-- Select Rating --</option>
            <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
            <option value="4">⭐⭐⭐⭐ Good</option>
            <option value="3">⭐⭐⭐ Average</option>
            <option value="2">⭐⭐ Poor</option>
            <option value="1">⭐ Very Bad</option>
          </select>
        </div>

        <!-- Feedback Message -->
        <div>
          <label for="message" class="block text-sm font-semibold text-gray-700">
            Your Feedback <span class="text-red-700">*</span>
          </label>
          <textarea
            id="message"
            name="message"
            required
            placeholder="Write your feedback here..."
            class="w-full px-4 py-2 border my-2 border-gray-300 rounded-lg focus:ring-1 focus:ring-blue-500 focus:outline-none min-h-[120px] resize-y"
          ></textarea>
        </div>

        <!-- Optional File Upload -->
        <div>
          <label for="file" class="block text-sm font-semibold text-gray-700">
            Attach File (optional)
          </label>
          <input
            type="file"
            id="file"
            name="attachment"
            accept="image/*,application/pdf"
            class="w-fit text-gray-700 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer"
          />
        </div>

        <!-- Submit Button -->
        <div class="text-center">
          <button
            type="submit"
            class="w-full md:w-full bg-blue-600 text-white font-semibold px-6 py-3 rounded-lg shadow-md hover:bg-blue-700 transition duration-300"
          >
            Submit Feedback
          </button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
