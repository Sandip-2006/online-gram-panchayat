{% extends 'layout.html' %}
{% block title %}
  Gallery
{% endblock %}
{% load static %}
{% block content %}

  <!-- Gallery Section -->
  <main class="container mx-auto px-4  ">
    <div class="bg-slate-50-100 py-12 text-center ">
      <h2 class="text-3xl font-bold mb-2">Village Gallery</h2>
      <p class="text-gray-600">Photos of Panchayat activities, schemes and events</p>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Gallery Item -->
       {% for gallery in images %}
       <div class="bg-white rounded-2xl shadow hover:shadow-lg overflow-hidden transform transition-transform hover:scale-105">
         <img src="{{gallery.image.url}}" alt="Village" class="w-full h-48 object-cover" />
         <div class="p-4">
           <h3 class="font-semibold">{{gallery.title}}</h3>
           <p class="text-sm text-gray-500">{{gallery.description}}</p>
          </div>
        </div>
        {% endfor %}
    </div>
  </main>
{% endblock %}
