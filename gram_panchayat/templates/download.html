{% extends 'layout.html' %}
{% load static %}

{% block content %}
  <div class="container mx-auto py-12 px-4">
    <!-- Heading Section -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-gray-800 mb-2">📄 Download Documents</h1>
      <p class="text-gray-600 text-lg">Download important Gram Panchayat documents from below.</p>
    </div>

    <div class="space-y-4">
      <!-- Document List Section -->
      {% for doc in documents %}
        <div class="bg-white shadow-lg rounded-2xl p-6 max-w-lg mx-auto">
          <a href="{{ doc.file.url }}" download="1image.jpg" class="flex items-center justify-between bg-blue-50 hover:bg-blue-100 text-blue-700 font-medium px-4 py-2 rounded-lg transition">
            <span>{{ doc.title }}</span>
            <!-- SVG Bounce Icon -->
            <span class="download-icon bounce-solo">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" class="w-6 h-6 fill-current text-blue-600">
                <path d="M352 96C352 78.3 337.7 64 320 64C302.3 64 288 78.3 288 96L288 306.7L246.6 265.3C234.1 252.8 213.8 252.8 201.3 265.3C188.8 277.8 188.8 298.1 201.3 310.6L297.3 406.6C309.8 419.1 330.1 419.1 342.6 406.6L438.6 310.6C451.1 298.1 451.1 277.8 438.6 265.3C426.1 252.8 405.8 252.8 393.3 265.3L352 306.7L352 96zM160 384C124.7 384 96 412.7 96 448L96 480C96 515.3 124.7 544 160 544L480 544C515.3 544 544 515.3 544 480L544 448C544 412.7 515.3 384 480 384L433.1 384L376.5 440.6C345.3 471.8 294.6 471.8 263.4 440.6L206.9 384L160 384zM464 440C477.3 440 488 450.7 488 464C488 477.3 477.3 488 464 488C450.7 488 440 477.3 440 464C440 450.7 450.7 440 464 440z" />
              </svg>
            </span>
          </a>
        </div>
      {% endfor %}
    </div>

    <!-- Loader Section -->
    <div class="flex justify-center items-center mt-16">
      <div class="pyramid-loader">
        <div class="wrapper">
          <span class="side side1"></span>
          <span class="side side2"></span>
          <span class="side side3"></span>
          <span class="side side4"></span>
          <span class="shadow"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Pyramid Loader Styles -->
  <style>
    @keyframes bounce-solo {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-5px);
      }
    }
    
    .bounce-solo {
      display: inline-block;
      animation: bounce-solo 1s infinite;
    }
    
    /* Bounce animation is from Tailwind animate-bounce */
    .pyramid-loader {
      position: relative;
      width: 200px;
      height: 200px;
      transform-style: preserve-3d;
      transform: rotateX(-20deg);
    }
    
    .wrapper {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: spin 4s linear infinite;
    }
    
    @keyframes spin {
      100% {
        transform: rotateY(360deg);
      }
    }
    
    .pyramid-loader .wrapper .side {
      width: 70px;
      height: 70px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      margin: auto;
      transform-origin: center top;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }
    
    .pyramid-loader .wrapper .side1 {
      transform: rotateZ(-30deg) rotateY(90deg);
      background: conic-gradient(#2bdeac, #f028fd, #d8cce6, #2f2585);
    }
    
    .pyramid-loader .wrapper .side2 {
      transform: rotateZ(30deg) rotateY(90deg);
      background: conic-gradient(#2f2585, #d8cce6, #f028fd, #2bdeac);
    }
    
    .pyramid-loader .wrapper .side3 {
      transform: rotateX(30deg);
      background: conic-gradient(#2f2585, #d8cce6, #f028fd, #2bdeac);
    }
    
    .pyramid-loader .wrapper .side4 {
      transform: rotateX(-30deg);
      background: conic-gradient(#2bdeac, #f028fd, #d8cce6, #2f2585);
    }
    
    .pyramid-loader .wrapper .shadow {
      width: 60px;
      height: 60px;
      background: #8b5ad5;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      margin: auto;
      transform: rotateX(90deg) translateZ(-40px);
      filter: blur(12px);
    }
  </style>
{% endblock %}
