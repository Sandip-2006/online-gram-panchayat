name: Django Docker Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22

          script: |
            echo "🚀 AUTO DEPLOY STARTED"

            cd /home/sadmin/apps/online-gram-panchayat

            echo "📥 Pull Latest Code"
            git fetch origin
            git reset --hard origin/main

            echo "🐳 Stop Old Containers"
            sudo docker compose down --remove-orphans

            echo "🐳 Build Fresh Image (No Cache)"
            sudo docker compose build --no-cache

            echo "🐳 Start Containers"
            sudo docker compose up -d

            echo "⏳ Waiting for container startup"
            sleep 15

            echo "📦 Apply Migrations"
            sudo docker compose exec -T web python manage.py migrate --noinput

            echo "🧹 Remove Old Static Files"
            sudo docker compose exec -T web rm -rf /app/staticfiles/*

            echo "📁 Collect Static"
            sudo docker compose exec -T web python manage.py collectstatic --noinput

            echo "🔄 Restart Nginx"
            sudo docker compose restart nginx

            echo "🧹 Cleanup Docker Images"
            sudo docker image prune -f

            echo "✅ DEPLOYMENT SUCCESSFUL"
