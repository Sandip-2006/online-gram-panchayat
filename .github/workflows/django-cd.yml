name: Django VPS Practice (Safe)

on:
  push:
    branches:
      - main


jobs:
  practice:
    runs-on: ubuntu-latest

    steps:
      - name: Auto Deploy Django App
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "🚀 Starting auto deploy"

            cd /home/sadmin/apps/online-gram-panchayat

            echo "📥 Syncing latest code"
            git fetch origin
            git reset --hard origin/main

            echo "🐍 Activating virtual environment"
            source venv/bin/activate || source .venv/bin/activate

            echo "🧹 Collecting static files"
            python manage.py collectstatic --noinput

            echo "🔄 Restarting Django service"
            sudo systemctl restart gram_panchayat

            echo "✅ Deploy completed successfully"

