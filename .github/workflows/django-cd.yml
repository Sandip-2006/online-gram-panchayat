name: Django VPS Practice (Safe)

on:
  push:
    branches:
      - main


jobs:
  practice:
    runs-on: ubuntu-latest

    steps:
      - name: Auto Deploy Django App
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "🚀 Starting controlled deploy (NO restart)"
            cd /home/sadmin/apps/online-gram-panchayat
            git status
            git pull origin main
            sudo systemctl restart gram_panchayat
            echo "✅ Code updated (NO service restart)"

