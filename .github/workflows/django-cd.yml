name: Django Docker Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22

          script: |
            echo "🚀 AUTO DEPLOY STARTED"

            cd /home/sadmin/apps/online-gram-panchayat

            echo "📥 Pull latest code"
            git fetch origin
            git reset --hard origin/main

            echo "🐳 Stop containers"
            sudo docker compose down --remove-orphans

            echo "🧹 Remove old images of this project"
            sudo docker image rm online-gram-panchayat-web || true

            echo "🔨 Build fresh image"
            sudo docker compose build --no-cache --pull

            echo "🚀 Start containers fresh"
            sudo docker compose up -d --force-recreate

            echo "✅ DEPLOY SUCCESS"

