name: Django Docker Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22

          script: |
            echo "🚀 AUTO DEPLOY STARTED"

            cd /home/sadmin/apps/online-gram-panchayat

            echo "📥 Pull latest code"
            git fetch origin
            git reset --hard origin/main

            echo "🐳 FULL CLEAN DEPLOY"
            sudo docker compose down -v --remove-orphans

            echo "🧹 Remove static manually"
            sudo rm -rf staticfiles/*
            sudo rm -rf media/*

            echo "🐳 Fresh build"
            sudo docker compose build --no-cache

            echo "🐳 Start containers"
            sudo docker compose up -d

            echo "⏳ Wait until Django ready"
            sleep 30

            echo "📦 Django migrations"
            sudo docker compose exec -T web python manage.py migrate --noinput

            echo "📁 Collect static"
            sudo docker compose exec -T web python manage.py collectstatic --noinput

            echo "🔄 Restart nginx"
            sudo docker compose restart nginx

            echo "🧹 Docker cleanup"
            sudo docker system prune -f

            echo "✅ DEPLOY SUCCESS"
